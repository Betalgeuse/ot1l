<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OT1L · 시간 맞추기</title><link rel="stylesheet" href="/styles.css"></head>
<body class="event-schedule-page" data-event-token="__EVENT_TOKEN__">
<main class="event-schedule-shell">
  <p class="eyebrow">ONE THING 1 LINE · EVENT</p>
  <header class="event-schedule-header"><div><h1 data-event-title>시간 맞추기</h1><p data-event-location>이벤트를 불러오는 중입니다.</p></div><a href="https://app.slack.com" class="button button--quiet">Slack으로 돌아가기</a></header>
  <section class="event-config" data-host-config hidden><h2>시간표와 성사 조건 열기</h2><div class="event-config-grid"><label>시작 날짜<input type="date" data-start-date></label><label>종료 날짜<input type="date" data-end-date></label><label>하루 시작<input type="time" data-day-start value="09:00"></label><label>하루 종료<input type="time" data-day-end value="22:00"></label><label>시간표 간격<select data-step><option value="30">30분</option><option value="60">1시간</option></select></label><label>진행 시간<select data-duration><option value="60">1시간</option><option value="90">1시간 30분</option><option value="120">2시간</option><option value="180">3시간</option><option value="240">4시간</option></select></label><label>유형<select data-kind><option value="gathering">한 번의 모임</option><option value="challenge">기간형 활동</option><option value="series">정기 모임</option></select></label><label>정기 모임 간격<select data-recurrence><option value="1">매주</option><option value="2">격주</option></select></label><label>정기 모임 회차<input type="number" min="2" max="24" value="4" data-occurrences></label><label>최소 인원<input type="number" min="1" max="100" value="2" data-min></label><label>최대 정원<input type="number" min="1" max="500" data-capacity placeholder="제한 없음"></label><label>모집 마감<input type="datetime-local" data-deadline></label><label>미달 유예<select data-grace><option value="24">24시간</option><option value="12">12시간</option><option value="48">48시간</option></select></label><label class="event-checkbox"><input type="checkbox" checked data-auto-cancel> 미달 시 자동 취소</label></div><p>정기 모임 간격과 회차는 유형이 ‘정기 모임’일 때만 적용됩니다.</p><button class="button" type="button" data-configure>시간표 열기</button></section>
  <section class="event-grid-section" data-grid-section hidden><div class="event-grid-heading"><div><h2>가능한 시간을 모두 선택해 주세요</h2><p>칸을 누르거나 드래그해 선택할 수 있습니다. 결과는 집계 수로 공유됩니다.</p></div><strong data-selected-count>0개 선택</strong></div><div class="event-grid-wrap"><div class="event-grid" data-grid></div></div><div class="event-actions"><button class="button" type="button" data-save>가능 시간 저장</button><button class="button button--quiet" type="button" data-finalize hidden>선택한 첫 시간을 최종 일정으로 확정</button><span role="status" data-status></span></div></section>
  <section class="event-empty" data-empty hidden><h2>아직 시간표가 열리지 않았어요.</h2><p>주최자가 시간표를 열면 이곳에서 가능한 시간을 표시할 수 있습니다.</p></section>
</main><script src="/event-schedule.js?v=20261003-2" defer></script></body></html>
